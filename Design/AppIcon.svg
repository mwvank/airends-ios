<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FB6A8"/>
      <stop offset="1" stop-color="#1E7F8C"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9814F"/>
      <stop offset="1" stop-color="#9A6438"/>
    </linearGradient>
    <radialGradient id="nose" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FF7A6B"/>
      <stop offset="1" stop-color="#E5332A"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(0 50)">

  <!-- Antlers drawn as little route lines, with stops as dots -->
  <g fill="none" stroke="#FFF4E0" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <path d="M392 330 C 360 250, 330 210, 268 170"/>
    <path d="M352 252 C 300 250, 262 268, 232 300"/>
    <path d="M325 212 C 330 160, 318 128, 300 100"/>
    <path d="M632 330 C 664 250, 694 210, 756 170"/>
    <path d="M672 252 C 724 250, 762 268, 792 300"/>
    <path d="M699 212 C 694 160, 706 128, 724 100"/>
  </g>
  <g fill="#FFC94A" stroke="#FFF4E0" stroke-width="10">
    <circle cx="268" cy="170" r="26"/>
    <circle cx="232" cy="300" r="26"/>
    <circle cx="300" cy="100" r="26"/>
    <circle cx="756" cy="170" r="26"/>
    <circle cx="792" cy="300" r="26"/>
    <circle cx="724" cy="100" r="26"/>
  </g>

  <!-- Ears -->
  <ellipse cx="302" cy="420" rx="92" ry="50" transform="rotate(-28 302 420)" fill="#9A6438"/>
  <ellipse cx="306" cy="420" rx="56" ry="26" transform="rotate(-28 306 420)" fill="#F2B7A0"/>
  <ellipse cx="722" cy="420" rx="92" ry="50" transform="rotate(28 722 420)" fill="#9A6438"/>
  <ellipse cx="718" cy="420" rx="56" ry="26" transform="rotate(28 718 420)" fill="#F2B7A0"/>

  <!-- Head -->
  <path d="M512 300 C 660 300, 720 400, 712 540 C 704 690, 620 840, 512 840 C 404 840, 320 690, 312 540 C 304 400, 364 300, 512 300 Z" fill="url(#fur)"/>
  <!-- Muzzle -->
  <ellipse cx="512" cy="700" rx="150" ry="120" fill="#F3DEC0"/>

  <!-- Sunglasses -->
  <defs>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3440"/>
      <stop offset="1" stop-color="#0E1116"/>
    </linearGradient>
  </defs>
  <g>
    <path d="M330 505 L 694 505" stroke="#111" stroke-width="22" stroke-linecap="round"/>
    <path d="M352 500 L 488 500 C 492 560, 470 600, 420 600 C 372 600, 350 565, 352 500 Z" fill="url(#lens)" stroke="#111" stroke-width="14" stroke-linejoin="round"/>
    <path d="M536 500 L 672 500 C 674 565, 652 600, 604 600 C 554 600, 532 560, 536 500 Z" fill="url(#lens)" stroke="#111" stroke-width="14" stroke-linejoin="round"/>
    <path d="M488 512 Q 512 498, 536 512" fill="none" stroke="#111" stroke-width="14" stroke-linecap="round"/>
    <path d="M372 520 L 410 520 L 380 565 Z" fill="#FFFFFF" opacity="0.35"/>
    <path d="M556 520 L 594 520 L 564 565 Z" fill="#FFFFFF" opacity="0.35"/>
  </g>
  <!-- Cheeks -->
  <ellipse cx="372" cy="625" rx="38" ry="22" fill="#F28C8C" opacity="0.55"/>
  <ellipse cx="652" cy="625" rx="38" ry="22" fill="#F28C8C" opacity="0.55"/>

  <!-- Nose -->
  <ellipse cx="512" cy="652" rx="66" ry="54" fill="url(#nose)"/>
  <ellipse cx="490" cy="634" rx="20" ry="13" fill="#FFFFFF" opacity="0.7"/>
  <!-- Smile -->
  <path d="M470 742 Q 512 778, 554 742" fill="none" stroke="#6B4226" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
